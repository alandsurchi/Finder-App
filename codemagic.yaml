# Codemagic (cloud Mac) builds for the iPhone.
#
# ios-unsigned: an unsigned .ipa for free testing on your own iPhone via
#   Sideloadly (free Apple ID, 7-day certificate, no push notifications).
# ios-testflight: signed build uploaded to TestFlight. Needs the paid Apple
#   Developer Program; fill in the integration + variables in Codemagic first.
workflows:
  ios-unsigned:
    name: iOS unsigned IPA (sideload)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.4   # same as the local toolchain; newer stable removed CupertinoPageTransitionsBuilder
      xcode: latest
      cocoapods: default
      vars:
        API_URL: https://finder-app-production-7c49.up.railway.app
    scripts:
      - name: Flutter packages
        script: |
          # Plugins are integrated through CocoaPods (ios/Podfile pins iOS 15 for
          # Firebase); Flutter's Swift Package Manager mode must stay off.
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build (no code signing)
        script: |
          set -e
          # Generate the Xcode config for a release build, then drive xcodebuild
          # ourselves with signing fully disabled (flutter's --no-codesign still
          # lets Xcode demand a development team).
          flutter build ios --release --no-codesign --config-only \
            --dart-define=API_URL=$API_URL \
            --build-number=$BUILD_NUMBER
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -derivedDataPath ../build/ios/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            -quiet
      - name: Package .ipa
        script: |
          set -e
          APP=build/ios/derived/Build/Products/Release-iphoneos/Runner.app
          test -d "$APP"
          rm -rf build/ios/Payload build/ios/Finder.ipa
          mkdir -p build/ios/Payload
          cp -R "$APP" build/ios/Payload/
          (cd build/ios && zip -qr Finder.ipa Payload)
          ls -la build/ios/Finder.ipa
    artifacts:
      - build/ios/Finder.ipa

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Finder ASC key   # create under Teams → Integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.finderapp.finder
      flutter: 3.41.4   # same as the local toolchain; newer stable removed CupertinoPageTransitionsBuilder
      xcode: latest
      cocoapods: default
      vars:
        API_URL: https://finder-app-production-7c49.up.railway.app
        APP_STORE_APPLE_ID: 0000000000   # App Store Connect → App → App Information → Apple ID
    scripts:
      - name: Flutter packages
        script: |
          # Plugins are integrated through CocoaPods (ios/Podfile pins iOS 15 for
          # Firebase); Flutter's Swift Package Manager mode must stay off.
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Signing files
        script: xcode-project use-profiles
      - name: Build signed .ipa
        script: |
          flutter build ipa --release \
            --dart-define=API_URL=$API_URL \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
